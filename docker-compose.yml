services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tend_staging
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres@db/tend_staging
      JWT_SECRET: changethislater
    depends_on:
      - db

volumes:
  postgres_data: